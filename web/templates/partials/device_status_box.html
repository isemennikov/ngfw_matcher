{% if selected_dev %}
  <div class="mt-3 mx-3 rounded-lg border px-3 py-2
    {% if selected_dev.last_sync %}bg-surface-muted/60 border-border
    {% else %}bg-warn-bg/30 border-warn-border/40{% endif %}">
    {% if selected_dev.last_sync %}
      <div class="flex items-center justify-between">
        <div class="flex items-center gap-1.5">
          <span class="w-1.5 h-1.5 rounded-full bg-allow flex-shrink-0"></span>
          <span class="text-xs text-allow font-medium">Снапшот актуален</span>
        </div>
        <span class="text-xs text-secondary font-mono">{{ selected_dev.last_sync[:10] }}</span>
      </div>
      <div class="mt-1.5 flex justify-between text-xs text-secondary border-t border-border pt-1.5">
        <span>Правил</span>
        <span class="font-mono text-muted">{{ selected_dev.rules_count }}</span>
      </div>
    {% else %}
      <div class="flex items-center gap-1.5">
        <span class="w-1.5 h-1.5 rounded-full bg-warn flex-shrink-0 animate-pulse"></span>
        <span class="text-xs text-warn font-medium">Sync не выполнен</span>
      </div>
      <div class="text-xs text-secondary mt-1">Нажмите ↻ для загрузки правил</div>
    {% endif %}
  </div>
{% endif %}

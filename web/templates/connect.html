<!DOCTYPE html>
<html lang="ru" data-theme="{{ theme | default('system') }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ngfw-matcher — Подключение</title>
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg?v={{ app_version }}">
  <meta name="theme-color" content="#F4F5F7">
  <script>
    (function () {
      try {
        var m = document.cookie.match(/(?:^|;\s*)theme=([^;]+)/);
        var mode = m ? decodeURIComponent(m[1]) : "system";
        var dark = mode === "dark" || (mode === "system" &&
          window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
      } catch (e) {}
    })();
  </script>
  <link rel="stylesheet" href="/static/css/tokens.css?v={{ app_version }}">
  <link rel="stylesheet" href="/static/css/tailwind.css?v={{ app_version }}">
  <link rel="stylesheet" href="/static/css/layout.css?v={{ app_version }}">
  <script src="/static/js/theme.js?v={{ app_version }}" defer></script>
</head>
<body class="login-body">

  <button type="button" data-theme-toggle aria-label="Переключить тему"
          class="theme-btn login-theme inline-flex items-center gap-1.5 border border-border
                 bg-surface hover:bg-surface-2 text-secondary rounded-lg px-2.5 py-1.5 text-xs font-medium">
    <span data-theme-icon aria-hidden="true">☾</span>
    <span data-theme-label>Тема</span>
  </button>

  <div class="login-card">

    <div class="flex items-center gap-3 mb-2">
      <div class="w-9 h-9 bg-[var(--red500)] rounded-lg flex items-center justify-center text-white font-bold text-lg">N</div>
      <div>
        <div class="text-body font-semibold text-base">ngfw-matcher</div>
        <div class="text-muted text-xs">Policy Analyzer · v{{ app_version }}</div>
      </div>
    </div>
    <p class="text-subtle text-xs mb-7">Анализ политик PT NGFW</p>

    {% if error is defined and error %}
      <div class="alert deny flex gap-3 items-start rounded-lg px-4 py-3 mb-5 text-sm
                  bg-deny-bg border border-deny-border text-deny">
        <svg class="w-4 h-4 flex-shrink-0 mt-0.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>
        </svg>
        <span>{{ error }}</span>
      </div>
    {% endif %}

    <div id="ro-warn"
         class="hidden alert warn rounded-lg px-4 py-3 mb-5 text-sm
                bg-warn-bg border border-warn-border text-warn">
      Используйте RO учётную запись
    </div>

    <form method="post" action="/connect" class="space-y-4" id="login-form">
      <div>
        <label for="host-input" class="form-label">Host</label>
        <input type="text" name="host" id="host-input" required
               value="{{ host | default('https://') }}"
               placeholder="https://10.1.31.100"
               class="input-field">
      </div>
      <div>
        <label for="user-input" class="form-label">Логин</label>
        <input type="text" name="user" id="user-input" required
               value="{{ user | default('') }}"
               placeholder="admin_ro"
               autocomplete="username"
               class="input-field">
      </div>
      <div>
        <label for="password-input" class="form-label">Пароль</label>
        <div class="relative">
          <input type="password" name="password" id="password-input" required
                 placeholder="••••••••"
                 autocomplete="current-password"
                 class="input-field pr-10">
          <button type="button" id="toggle-password"
                  aria-label="Показать пароль"
                  class="absolute inset-y-0 right-0 flex items-center px-3 text-subtle hover:text-secondary">
            <svg id="eye-icon" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
                d="M2.036 12.322a1.012 1.012 0 010-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178z"/>
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
            </svg>
          </button>
        </div>
      </div>
      <button type="submit" id="submit-btn"
              class="w-full btn-primary py-2.5 mt-2">
        Подключиться
      </button>
    </form>

    <script>
      const userInput = document.getElementById('user-input');
      const roWarn   = document.getElementById('ro-warn');
      const submitBtn = document.getElementById('submit-btn');

      function checkRo() {
        const val = userInput.value.trim().toLowerCase();
        const ok  = val === '' || val.endsWith('ro');
        roWarn.classList.toggle('hidden', ok);
        submitBtn.disabled = !ok;
        submitBtn.classList.toggle('opacity-50', !ok);
        submitBtn.classList.toggle('cursor-not-allowed', !ok);
      }

      userInput.addEventListener('input', checkRo);
      checkRo();

      const pwInput  = document.getElementById('password-input');
      const pwToggle = document.getElementById('toggle-password');
      pwToggle.addEventListener('click', function() {
        const shown = pwInput.type === 'text';
        pwInput.type = shown ? 'password' : 'text';
        pwToggle.setAttribute('aria-label', shown ? 'Показать пароль' : 'Скрыть пароль');
      });
    </script>
  </div>
</body>
</html>
